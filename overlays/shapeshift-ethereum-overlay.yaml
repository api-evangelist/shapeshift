overlay: 1.0.0
info:
  title: API Evangelist enhancements for ShapeShift Unchained (ethereum)
  version: 1.0.0
extends: openapi/shapeshift-ethereum-openapi.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: shapeshift
      x-apievangelist-chain: ethereum
      x-apievangelist-auth: public-none
      x-apievangelist-realtime: websocket-transaction-updates
      x-apievangelist-source: https://api.ethereum.shapeshift.com/swagger.json
  - target: $.servers
    update:
      - url: https://api.ethereum.shapeshift.com
        description: ethereum unchained production host
