      - CREATE_BET
      - INIT_RENT
      - NFT_RENT_LISTING
      - NFT_RENT_CANCEL_LISTING
      - NFT_RENT_UPDATE_LISTING
      - NFT_RENT_ACTIVATE
      - NFT_RENT_END
      - UPGRADE_PROGRAM_INSTRUCTION
      - FINALIZE_PROGRAM_INSTRUCTION
      - EXECUTE_TRANSACTION
      - APPROVE_TRANSACTION
      - ACTIVATE_TRANSACTION
      - CREATE_TRANSACTION
