openapi: 3.2.0
info:
  title: Shapeshift Account API
  version: 10.0.0
  contact: {}
  license:
    name: MIT
  description: 'Operations tagged Account across 3 of this provider''s published API definitions: shapeshift-bitcoin-openapi.json, shapeshift-ethereum-openapi.json, shapeshift-solana-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.bitcoin.shapeshift.com
  description: bitcoin unchained API
- url: https://api.ethereum.shapeshift.com
  description: ethereum unchained API
- url: https://api.solana.shapeshift.com
  description: solana unchained API
tags:
- name: Account
paths:
  /api/v1/account/{pubkey}:
    get:
      operationId: GetAccount
      responses:
        '200':
          description: account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get account details by address or extended public key
      tags:
      - Account
      security: []
      parameters:
      - description: account address or extended public key
        in: path
        name: pubkey
        required: true
        schema:
          type: string
      summary: Get account
      x-summary-source: derived
    servers:
    - url: https://api.bitcoin.shapeshift.com
      description: bitcoin unchained API
  /api/v1/account/{pubkey}/txs:
    get:
      operationId: GetTxHistory
      responses:
        '200':
          description: transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxHistory'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get transaction history by address or extended public key
      tags:
      - Account
      security: []
      parameters:
      - description: account address or extended public key
        in: path
        name: pubkey
        required: true
        schema:
          type: string
      - description: the cursor returned in previous query (base64 encoded json object with a 'page' property)
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: page size (10 by default)
        in: query
        name: pageSize
        required: false
        schema:
          default: 10
          format: double
          type: number
      summary: Get tx history
      x-summary-source: derived
    servers:
    - url: https://api.bitcoin.shapeshift.com
      description: bitcoin unchained API
  /api/v1/account/{pubkey}/utxos:
    get:
      operationId: GetUtxos
      responses:
        '200':
          description: account utxos
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Utxo'
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      description: Get all unspent transaction outputs for an address or extended public key
      tags:
      - Account
      security: []
      parameters:
      - description: account address or extended public key
        in: path
        name: pubkey
        required: true
        schema:
          type: string
      summary: Get utxos
      x-summary-source: derived
    servers:
    - url: https://api.bitcoin.shapeshift.com
      description: bitcoin unchained API
components:
  schemas:
    InternalServerError:
      description: Contains info about a 500 Internal Server Error response
      properties:
        message:
          type: string
      required:
      - message
      type: object
      additionalProperties: false
    Vout:
      description: Contains info about a transaction output
      properties:
        value:
          type: string
        n:
          type: number
          format: double
        opReturn:
          type: string
        scriptPubKey:
          properties:
            hex:
              type: string
          type: object
        addresses:
          items:
            type: string
          type: array
      required:
      - value
      - n
      - scriptPubKey
      type: object
      additionalProperties: false
    BaseTxHistory_Tx_:
      description: Contains paginated base transaction history details
      properties:
        cursor:
          type: string
        pubkey:
          type: string
        txs:
          items:
            $ref: '#/components/schemas/Tx'
          type: array
      required:
      - pubkey
      - txs
      type: object
      additionalProperties: false
    TxHistory:
      $ref: '#/components/schemas/BaseTxHistory_Tx_'
      description: Contains info about transaction history
    BadRequestError:
      description: Contains info about a 400 Bad Request response
      properties:
        error:
          type: string
      required:
      - error
      type: object
      additionalProperties: false
    Utxo:
      description: Contains info about an unspent transaction output
      properties:
        txid:
          type: string
        vout:
          type: number
          format: double
        value:
          type: string
        height:
          type: number
          format: double
        confirmations:
          type: number
          format: double
        address:
          type: string
        path:
          type: string
        locktime:
          type: number
          format: double
        coinbase:
          type: boolean
      required:
      - txid
      - vout
      - value
      - confirmations
      type: object
      additionalProperties: false
    Account:
      description: Contains info about an address or extended public key account
      properties:
        balance:
          type: string
        unconfirmedBalance:
          type: string
        pubkey:
          type: string
        addresses:
          items:
            $ref: '#/components/schemas/Address'
          type: array
          description: List of associated addresses for an extended public key
        nextReceiveAddressIndex:
          type: number
          format: double
          description: The next unused receive address index for an extended public key (change index 0)
        nextChangeAddressIndex:
          type: number
          format: double
          description: The next unused change address index for an extended public key (change index 1)
      required:
      - balance
      - unconfirmedBalance
      - pubkey
      type: object
      additionalProperties: false
    Tx:
      description: Contains info about a transaction
      properties:
        txid:
          type: string
        blockHash:
          type: string
        blockHeight:
          type: number
          format: double
        timestamp:
          type: number
          format: double
        vin:
          items:
            $ref: '#/components/schemas/Vin'
          type: array
        vout:
          items:
            $ref: '#/components/schemas/Vout'
          type: array
        confirmations:
          type: number
          format: double
        value:
          type: string
        fee:
          type: string
        hex:
          type: string
      required:
      - txid
      - blockHeight
      - timestamp
      - vin
      - vout
      - confirmations
      - value
      - fee
      - hex
      type: object
      additionalProperties: false
    Vin:
      description: Contains info about a transaction input
      properties:
        txid:
          type: string
        vout:
          type: string
        sequence:
          type: number
          format: double
        coinbase:
          type: string
        scriptSig:
          properties:
            hex:
              type: string
          type: object
        addresses:
          items:
            type: string
          type: array
        value:
          type: string
      type: object
      additionalProperties: false
    ValidationError:
      description: Contains info about a 422 Validation Error response
      properties:
        message:
          type: string
          enum:
          - Validation failed
        details:
          properties: {}
          additionalProperties: {}
          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    Address:
      description: Contains info about an address associated with an extended public key
      properties:
        balance:
          type: string
        pubkey:
          type: string
        path:
          type: string
          description: 'BIP44 derivation path for the address (e.g. `m/84''/0''/0''/0/3`).

            Present only for xpub-derived addresses.'
      required:
      - balance
      - pubkey
      type: object
      additionalProperties: false
    TokenBalance:
      description: Contains info about a token including balance for an address
      properties:
        contract:
          type: string
        decimals:
          type: number
          format: double
        name:
          type: string
        symbol:
          type: string
        type:
          type: string
        id:
          type: string
          description: nft or multi token id
        balance:
          type: string
      required:
      - contract
      - decimals
      - name
      - symbol
      - type
      - balance
      type: object
      additionalProperties: false
    TxHistory_2:
      $ref: '#/components/schemas/BaseTxHistory_Tx_'
      description: Contains info about EVM transaction history
    InternalTx:
      description: Contains info about an EVM internal transaction
      properties:
        from:
          type: string
        to:
          type: string
        value:
          type: string
      required:
      - from
      - to
      - value
      type: object
      additionalProperties: false
    Account_2:
      description: Contains info about an EVM account
      properties:
        balance:
          type: string
        unconfirmedBalance:
          type: string
        pubkey:
          type: string
        nonce:
          type: number
          format: double
        tokens:
          items:
            $ref: '#/components/schemas/TokenBalance'
          type: array
      required:
      - balance
      - unconfirmedBalance
      - pubkey
      - nonce
      - tokens
      type: object
      additionalProperties: false
    Tx_2:
      description: Contains info about an EVM transaction
      properties:
        txid:
          type: string
        blockHash:
          type: string
        blockHeight:
          type: number
          format: double
        timestamp:
          type: number
          format: double
        from:
          type: string
        to:
          type: string
        confirmations:
          type: number
          format: double
        value:
          type: string
        fee:
          type: string
        gasLimit:
          type: string
        gasUsed:
          type: string
        gasPrice:
          type: string
        status:
          type: number
          format: double
        inputData:
          type: string
        tokenTransfers:
          items:
            $ref: '#/components/schemas/TokenTransfer'
          type: array
        internalTxs:
          items:
            $ref: '#/components/schemas/InternalTx'
          type: array
      required:
      - txid
      - blockHeight
      - timestamp
      - from
      - to
      - confirmations
      - value
      - fee
      - gasLimit
      - gasPrice
      - status
      type: object
      additionalProperties: false
    TokenTransfer:
      description: Contains info about a token including transfer details
      properties:
        contract:
          type: string
        decimals:
          type: number
          format: double
        name:
          type: string
        symbol:
          type: string
        type:
          type: string
        id:
          type: string
          description: nft or multi token id
        from:
          type: string
        to:
          type: string
        value:
          type: string
      required:
      - contract
      - decimals
      - name
      - symbol
      - type
      - from
      - to
      - value
      type: object
      additionalProperties: false
    CompressedNftCreator:
      properties:
        address:
          type: string
        share:
          type: number
          format: double
        verified:
          type: boolean
      required:
      - address
      - share
      - verified
      type: object
      additionalProperties: false
    TokenStandard:
      enum:
      - ProgrammableNonFungible
      - NonFungible
      - Fungible
      - FungibleAsset
      - NonFungibleEdition
      - UnknownStandard
      type: string
    TokenBalance_2:
      description: Contains info about a token including balance for an address
      properties:
        id:
          type: string
        decimals:
          type: number
          format: double
        name:
          type: string
        symbol:
          type: string
        type:
          type: string
        balance:
          type: string
      required:
      - id
      - decimals
      - name
      - symbol
      - type
      - balance
      type: object
      additionalProperties: false
    TokenBalanceChange:
      properties:
        userAccount:
          type: string
        tokenAccount:
          type: string
        rawTokenAmount:
          $ref: '#/components/schemas/RawTokenAmount'
        mint:
          type: string
      required:
      - userAccount
      - tokenAccount
      - rawTokenAmount
      - mint
      type: object
      additionalProperties: false
    TransactionType:
      enum:
