notes: >-
  Address-centric model: the pubkey (address or xpub) is the primary key that
  fans out to balances, token balances, transaction history, and (on UTXO
  chains) UTXOs. Transaction shape differs by chain family — EVM adds
  InternalTx/tokenTransfers, Solana adds an EnrichedTransaction with swap/NFT
  events, UTXO adds Vin/Vout.
